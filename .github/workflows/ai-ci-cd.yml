name: AI CI/CD - Spring Boot (Maven)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        shell: bash
        run: |
          JAVA_DIR=$(dirname "$(find . -name pom.xml -not -path '*/target/*' | head -n 1)")
          cd "${JAVA_DIR:-.}"
          mvn -B clean compile

      - name: Run Tests
        shell: bash
        run: |
          JAVA_DIR=$(dirname "$(find . -name pom.xml -not -path '*/target/*' | head -n 1)")
          cd "${JAVA_DIR:-.}"
          mvn -B test

      - name: Package
        shell: bash
        run: |
          JAVA_DIR=$(dirname "$(find . -name pom.xml -not -path '*/target/*' | head -n 1)")
          cd "${JAVA_DIR:-.}"
          mvn -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: '**/target/*.jar'
